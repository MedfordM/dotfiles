source=~/.config/hypr/mocha.conf

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto

monitor = desc:LG Electronics LG ULTRAGEAR+ 307NTDV6F498, preferred, 0x0, 1
monitor = desc:LG Electronics 27GN950 110NTKF4X333, preferred, auto-left, 1
monitor = desc:LG Electronics LG ULTRAGEAR 012NTDVBT818, preferred, auto-right, 1

$terminal = kitty
$fileManager = nautilus
$menu = hyprlauncher

exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = $lavender
    col.inactive_border = $overlay0
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

group {
    col.border_active = $green
    col.border_inactive = $overlay0
    groupbar {
        font_size = 12
        text_color = $blue
        text_color_inactive = $overlay0
        text_color_locked_active = $surface0
        text_color_locked_inactive = $surface1
        col.inactive = $surface0
        col.locked_active = $red
        col.active = $crust
        col.locked_inactive = $rosewater
        indicator_height = 3
        gradients = true
    }
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)
    bezier = easeInSine, 0.12, 0, 0.39, 0
    bezier = easeInQuad, 0.11, 0, 0.5, 0
    bezier = easeInCirc,   0.55, 0, 1, 0.45
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = easeInBack, 0.36, 0, 0.66, -0.33
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     2.5,  easeInBack, slide
    animation = workspacesIn,  1,     2.5,  easeInBack, slide
    animation = workspacesOut, 1,     2.5,  easeInBack, slide
    animation = zoomFactor,    1,     7,     quick
}


dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 45
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = -0.5 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = false
    }
}

$hyper = SUPER ALT CONTROL 
$hyperShift = $hyper SHIFT

bind = $hyper, M, exec, pamixer --source 'alsa_input.usb-Elgato_Systems_Elgato_Wave_XLR_DS42K3A02210-00.mono-fallback' -t
bind = , Print, exec, flameshot gui

bind = $hyper, Return, exec, $terminal
bind = $hyper, Q, killactive,
bind = $hyperShift, V, togglefloating,
bind = $hyper, SPACE, exec, $menu
bind = $hyper, P, pseudo, # dwindle

# Move focus with hyper + arrow keys
bind = $hyper, h, movefocus, l
bind = $hyper, i, movefocus, r
bind = $hyper, e, movefocus, u
bind = $hyper, n, movefocus, d

# Move window with hyper + SHIFT + arrow keys
bind = $hyperShift, h, movewindoworgroup, l
bind = $hyperShift, i, movewindoworgroup, r
bind = $hyperShift, e, movewindoworgroup, u
bind = $hyperShift, n, movewindoworgroup, d

# Switch workspaces with hyper + [0-9]
bind = $hyper, a, workspace, r~1
bind = $hyper, r, workspace, r~2
bind = $hyper, s, workspace, r~3
bind = $hyper, t, workspace, r~4
bind = $hyper, d, workspace, r~5

# Move active window to a workspace with hyper + SHIFT + [0-9]
bind = $hyperShift, a, movetoworkspace, r~1
bind = $hyperShift, r, movetoworkspace, r~2
bind = $hyperShift, s, movetoworkspace, r~3
bind = $hyperShift, t, movetoworkspace, r~4
bind = $hyperShift, d, movetoworkspace, r~5

# Scroll through existing workspaces with hyper + scroll
bind = $hyper, mouse_down, workspace, e+1
bind = $hyper, mouse_up, workspace, e-1

# Move/resize windows with hyper + LMB/RMB and dragging
bindm = $hyper, mouse:272, movewindow
bindm = $hyper, mouse:273, resizewindow

bind = $hyperShift, x, submap, resize
submap = resize
binde = , h, resizeactive, -15 0
binde = , n, resizeactive, 0 -15
binde = , e, resizeactive, 0 15
binde = , i, resizeactive, 15 0
bind = , catchall, submap, reset
submap = reset

# Window Manager keybinds
bind = $hyper, f, fullscreen,
bind = $hyperShift, f, togglefloating,

# Groups
bind = $hyper, g, togglegroup
bind = $hyperShift, g, lockgroups, toggle
# bind = $hyper, COMMA, changegroupactive, b
# bind = $hyper, PERIOD, changegroupactive, f
bind = $hyper, COMMA,  exec, group_index=$(hyprctl activewindow -j | jq ".grouped|index(\"$(hyprctl activewindow -j | jq -r '.address')\")"); hyprctl dispatch changegroupactive $(($group_index < 1 ? 1 : $group_index))
bind = $hyper, PERIOD, exec, group_index=$(hyprctl activewindow -j | jq ".grouped|index(\"$(hyprctl activewindow -j | jq -r '.address')\") + 1"); hyprctl dispatch changegroupactive $((group_index + 1))
bind = $hyperShift, PERIOD, movegroupwindow, f
bind = $hyperShift, COMMA, movegroupwindow, b

workspace = 1, defaultName:1, monitor:DP-1, default:true
workspace = 2, defaultName:2, monitor:DP-1, default:false
workspace = 3, defaultName:3, monitor:DP-1, default:false
workspace = 4, defaultName:4, monitor:DP-1, default:false
workspace = 5, defaultName:5, monitor:DP-1, default:false
workspace = 6, defaultName:6, monitor:DP-2, default:true
workspace = 7, defaultName:7, monitor:DP-2, default:false
workspace = 8, defaultName:8, monitor:DP-2, default:false
workspace = 9, defaultName:9, monitor:DP-2, default:false
workspace = 10, defaultName:10, monitor:DP-2, default:false
workspace = 11, defaultName:11, monitor:DP-3, default:true
workspace = 12, defaultName:12, monitor:DP-3, default:false
workspace = 13, defaultName:13, monitor:DP-3, default:false
workspace = 14, defaultName:14, monitor:DP-3, default:false
workspace = 15, defaultName:15, monitor:DP-3, default:false

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = flameshot-multi-display-fix
    match:class = flameshot
    animation = fade
    float = on
    pin = on
    move = -7680 0
}

